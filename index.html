<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Finanças — Controle Financeiro</title>
  <meta name="description" content="Controle financeiro pessoal simples, rápido e elegante." />
  <meta name="theme-color" content="#16A34A" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0C0D10" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finanças" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="public/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="public/icons/icon-192.png" />
  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/styles/layout.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
  <script>
    // Apply persisted theme before first paint to avoid a flash of the wrong theme.
    try {
      var session = localStorage.getItem('financas.session');
      var raw = session ? localStorage.getItem('financas.v1.' + session) : null;
      var theme = raw ? (JSON.parse(raw).settings || {}).theme : null;
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <main id="screen-root" class="screen" role="main"></main>
    <button id="fab" class="fab" aria-label="Adicionar movimentação"></button>
    <nav id="tab-bar" class="tab-bar" aria-label="Navegação principal"></nav>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="src/js/main.js"></script>
</body>
</html>
