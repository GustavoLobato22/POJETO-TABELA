<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>PMES Estudos — Preparação para o Concurso da Polícia Militar do ES</title>
  <meta name="description" content="Plataforma de estudos completa e inteligente para o concurso de Soldado da PMES: banco de questões, simulados, flashcards com repetição espaçada, plano de estudos adaptativo e gamificação." />
  <meta name="theme-color" content="#1C3F72" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0A0C11" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PMES Estudos" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="public/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="public/icons/icon-192.png" />
  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/styles/layout.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
  <script>
    // Apply persisted theme before first paint to avoid a flash of the wrong theme.
    // Data is namespaced per local profile (see src/js/store/profiles.js), so
    // first resolve the active profile, then read that profile's own theme.
    try {
      var registryRaw = localStorage.getItem('pmes-estudos.profiles.v1');
      var activeId = registryRaw ? JSON.parse(registryRaw).activeProfileId : null;
      if (activeId) {
        var raw = localStorage.getItem('pmes-estudos.v1:' + activeId);
        var theme = raw ? (JSON.parse(raw).settings || {}).theme : null;
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <main id="screen-root" class="screen" role="main"></main>
    <button id="fab" class="fab" aria-label="Praticar agora"></button>
    <nav id="tab-bar" class="tab-bar" aria-label="Navegação principal"></nav>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="src/js/main.js"></script>
</body>
</html>
